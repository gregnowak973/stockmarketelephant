async function open(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:un(SALT), iterations:ITER, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({name:'AES-GCM', iv:un(IV)}, key, un(CT));
  const ds = new DecompressionStream('gzip');
  const html = await new Response(new Blob([gz]).stream().pipeThrough(ds)).text();
  try { sessionStorage.setItem('pr_pw', pw); } catch(e) {}
  document.open(); document.write(html); document.close();
}
async function attempt(pw){
  const b = document.getElementById('go'), e = document.getElementById('err');

  try { await open(pw); } catch(err) { e.textContent = 'Wrong password.'; b.disabled = false; }
}
